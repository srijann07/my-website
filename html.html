<!-- Natural Disaster Risk Assessment Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Disaster Risk Assessment Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="ss.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Natural Disaster Risk Assessment Dashboard</h1>
        <p>Visualize and assess disaster risks in your region</p>
    </header>
    <div class="container">
        <aside class="sidebar">
            <h2>Filters</h2>
            <div class="filter-group">
                <label for="disasterType">Disaster Type:</label>
                <select id="disasterType" multiple size="7">
                    <option value="all" selected>All</option>
                    <option value="earthquake">Earthquake</option>
                    <option value="flood">Flood</option>
                    <option value="storm">Storm</option>
                    <option value="tsunami">Tsunami</option>
                    <option value="volcano">Volcano</option>
                    <option value="landslide">Landslide</option>
                    <option value="wildfire">Wildfire</option>
                    <option value="drought">Drought</option>
                    <option value="avalanche">Avalanche</option>
                    <option value="cyclone">Cyclone</option>
                    <option value="hurricane">Hurricane</option>
                    <option value="tornado">Tornado</option>
                    <option value="blizzard">Blizzard</option>
                    <option value="hail">Hailstorm</option>
                    <option value="heatwave">Heatwave</option>
                    <option value="coldwave">Coldwave</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="region">Region:</label>
                <input type="text" id="region" placeholder="Enter country or region...">
            </div>
            <div class="filter-group">
                <label for="timePeriod">Time Period:</label>
                <select id="timePeriod">
                    <option value="1y">Last 1 Year</option>
                    <option value="5y">Last 5 Years</option>
                    <option value="10y">Last 10 Years</option>
                    <option value="all">All Available</option>
                </select>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-group" style="display: flex; gap: 4%;">
                <div style="flex:1;">
                    <label for="minMag">Min Magnitude:</label>
                    <input type="number" id="minMag" placeholder="e.g. 4" min="0" max="10" step="0.1">
                </div>
                <div style="flex:1;">
                    <label for="maxMag">Max Magnitude:</label>
                    <input type="number" id="maxMag" placeholder="e.g. 8" min="0" max="10" step="0.1">
                </div>
            </div>
            <div class="filter-group" style="display: flex; gap: 4%;">
                <div style="flex:1;">
                    <label for="minDepth">Min Depth (km):</label>
                    <input type="number" id="minDepth" placeholder="e.g. 0" min="-100" max="1000" step="1">
                </div>
                <div style="flex:1;">
                    <label for="maxDepth">Max Depth (km):</label>
                    <input type="number" id="maxDepth" placeholder="e.g. 700" min="-100" max="1000" step="1">
                </div>
            </div>
            <div class="filter-divider"></div>
            <button id="applyFilters">Apply Filters</button>
            <button id="downloadReport">Download Report</button>
        </aside>
        <main class="main">
            <div id="map"></div>
            <div class="charts">
                <div class="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="severityChart"></canvas>
                </div>
            </div>
            <div class="risk-tips">
                <h3>Risk Management Tips</h3>
                <ul id="tipsList">
                    <li>Select a region and disaster type to view safety tips.</li>
                </ul>
            </div>
        </main>
    </div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
    <script src="srij.js" defer></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        // Placeholder for disaster data overlays
        // ...
        // Placeholder for Chart.js charts
        var historyChart = new Chart(document.getElementById('historyChart'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Occurrences', data: [] }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        var severityChart = new Chart(document.getElementById('severityChart'), {
            type: 'pie',
            data: { labels: ['Low', 'Moderate', 'High'], datasets: [{ data: [0,0,0], backgroundColor: ['#4caf50','#ffeb3b','#f44336'] }] },
            options: { responsive: true }
        });
        // Placeholder for filter and report logic
    </script>
</body>
</html>
